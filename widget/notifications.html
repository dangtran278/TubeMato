<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set theme before first paint; main passes ?theme= when loading the overlay. -->
    <script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
    <title>TubeMato Notifications</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: transparent; overflow: hidden; }
      body {
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      /* Fixed-width column, bottom-anchored; main sizes the window to this element's box. */
      #stack {
        width: 424px;
        padding: 11px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      .ntf {
        position: relative;
        display: flex;
        gap: 13px;
        background: rgba(15, 15, 19, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 4px solid var(--kind, #e05a3a);
        border-radius: 13px;
        backdrop-filter: blur(12px);
        color: #f0f0f5;
        padding: 15px 38px 15px 17px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        animation: ntf-in 160ms ease;
      }

      .ntf__iconCol {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .ntf__icon {
        width: 40px;
        height: 40px;
        object-fit: contain;
        margin-top: 1px;
      }
      .ntf__main { flex: 1; min-width: 0; }
      .ntf--event        { --kind: #e05a3a; }
      .ntf--summary      { --kind: #3aabe0; }
      .ntf--reminder     { --kind: #e0a13a; }
      .ntf--procrastination { --kind: #f87171; }

      .ntf--clickable { cursor: pointer; }
      .ntf--clickable:hover { background: rgba(28, 28, 34, 0.95); }

      .ntf__title {
        font-size: 14.5px;
        font-weight: 600;
        line-height: 1.3;
        color: #f0f0f5;
      }
      .ntf__text {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.45;
        color: #b9b9c8;
        overflow-wrap: anywhere;
      }

      .ntf__close {
        position: absolute;
        top: 9px;
        right: 9px;
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #8a8a9c;
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ntf__close:hover { background: rgba(255, 255, 255, 0.1); color: #f0f0f5; }

      /* Lives in its own column, directly under the mascot icon (not under the title/text). */
      .ntf__action {
        padding: 6px 12px;
        border: 1px solid rgba(224, 90, 58, 0.4);
        border-radius: 8px;
        background: rgba(224, 90, 58, 0.22);
        color: #ff8a6a;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .ntf__action:hover { background: rgba(224, 90, 58, 0.36); }

      /* Depleting reading-time bar (auto-dismiss cards only). */
      .ntf__bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.06);
      }
      .ntf__fill {
        height: 100%;
        width: 100%;
        background: var(--kind, #e05a3a);
      }

      @keyframes ntf-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Light theme ── */
      /* Only the three non-accent sides: the `border-color` shorthand would overwrite the colored
         `border-left` (var(--kind)) from the base rule, dropping the accent edge in light mode. */
      [data-theme="light"] .ntf {
        background: rgba(255, 255, 255, 0.96);
        border-top-color: rgba(0, 0, 0, 0.1);
        border-right-color: rgba(0, 0, 0, 0.1);
        border-bottom-color: rgba(0, 0, 0, 0.1);
        color: #1b1b24;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      }
      [data-theme="light"] .ntf--clickable:hover { background: rgba(245, 245, 248, 0.98); }
      [data-theme="light"] .ntf__title { color: #1b1b24; }
      [data-theme="light"] .ntf__text { color: #5a5a70; }
      [data-theme="light"] .ntf__close { color: #8a8a9c; }
      [data-theme="light"] .ntf__close:hover { background: rgba(0, 0, 0, 0.08); color: #14161d; }
      [data-theme="light"] .ntf__action { color: #c2410c; }
      [data-theme="light"] .ntf__bar { background: rgba(0, 0, 0, 0.08); }
    </style>
  </head>
  <body>
    <div id="stack"></div>

    <script type="module">
      const stack = document.getElementById("stack");
      const N = window.tubemato.notifications;

      // Cards in arrival order. Auto-dismiss cards deplete a reading-time budget, but only the NEWEST
      // one runs at a time (LIFO): older auto cards freeze at their current fraction and resume once
      // the newer ones above them clear. Persist (event) cards never count down; main removes them.
      const cards = []; // { id, data, el, remaining, persist }
      let hovering = false;
      let lastTs = 0;

      stack.addEventListener("mouseenter", () => (hovering = true));
      stack.addEventListener("mouseleave", () => (hovering = false));

      function activeIndex() {
        for (let i = cards.length - 1; i >= 0; i--) if (!cards[i].persist) return i;
        return -1;
      }

      function relayout() {
        // Measure synchronously (reading the rect forces layout) and let main size + bottom-right-
        // anchor the window to fit. Must NOT defer via requestAnimationFrame: while the window is
        // hidden (count was 0), Chromium suspends rAF, so a deferred measure never runs and the
        // window is never told to re-show, i.e. the alert chimes with no visible card.
        const r = stack.getBoundingClientRect();
        N.resize(Math.ceil(r.width), Math.ceil(r.height), cards.length);
      }

      function removeCard(id) {
        const i = cards.findIndex((c) => c.id === id);
        if (i < 0) return;
        cards[i].el.remove();
        cards.splice(i, 1);
        N.dismissed(id);
        relayout();
      }

      function fireAction(card) {
        if (card.data.action) N.action(card.id, card.data.action, card.data.actionData);
        removeCard(card.id);
      }

      function buildEl(n) {
        const el = document.createElement("div");
        el.className = "ntf ntf--" + n.kind + (n.persist || n.action ? " ntf--clickable" : "");
        el.dataset.id = n.id;

        let iconCol = null;
        if (n.iconDataUrl || (n.persist && n.action)) {
          iconCol = document.createElement("div");
          iconCol.className = "ntf__iconCol";
          el.appendChild(iconCol);
        }
        if (n.iconDataUrl) {
          const icon = document.createElement("img");
          icon.className = "ntf__icon";
          icon.src = n.iconDataUrl;
          icon.alt = "";
          iconCol.appendChild(icon);
        }

        const main = document.createElement("div");
        main.className = "ntf__main";
        el.appendChild(main);

        const title = document.createElement("div");
        title.className = "ntf__title";
        title.textContent = n.title;
        main.appendChild(title);

        if (n.body) {
          const text = document.createElement("div");
          text.className = "ntf__text";
          text.textContent = n.body;
          main.appendChild(text);
        }

        const close = document.createElement("button");
        close.className = "ntf__close";
        close.setAttribute("aria-label", "Dismiss");
        close.textContent = "×";
        close.addEventListener("click", (e) => { e.stopPropagation(); removeCard(n.id); });
        el.appendChild(close);

        if (n.persist) {
          // Event card: clicking the body (anywhere but Start / ×) opens the Calendar; the card
          // persists until Start is clicked or the event ends.
          el.addEventListener("click", () => N.action(n.id, "open-calendar"));
          if (n.action) {
            const btn = document.createElement("button");
            btn.className = "ntf__action";
            btn.textContent = n.actionLabel || "Start";
            btn.addEventListener("click", (e) => { e.stopPropagation(); fireAction(cardById(n.id)); });
            iconCol.appendChild(btn);
          }
        } else {
          // Auto-dismiss card: whole card routes its action, plus a depleting reading-time bar.
          if (n.action) el.addEventListener("click", () => fireAction(cardById(n.id)));
          const bar = document.createElement("div");
          bar.className = "ntf__bar";
          const fill = document.createElement("div");
          fill.className = "ntf__fill";
          bar.appendChild(fill);
          el.appendChild(bar);
        }
        return el;
      }

      function cardById(id) { return cards.find((c) => c.id === id); }

      function addCard(n) {
        if (cards.some((c) => c.id === n.id)) return; // dedup a repeated fire
        const el = buildEl(n);
        stack.appendChild(el); // newest at the bottom
        cards.push({ id: n.id, data: n, el, remaining: n.durationMs || 0, persist: !!n.persist });
        // The frame loop was throttled while the window was hidden; drop the stale gap so the newly
        // active card doesn't lose a big chunk of time on the first frame after we re-show.
        lastTs = 0;
        relayout();
      }

      function frame(ts) {
        const dt = lastTs ? ts - lastTs : 0;
        lastTs = ts;
        const ai = activeIndex();
        if (ai >= 0 && !hovering) {
          const c = cards[ai];
          c.remaining -= dt;
          const frac = Math.max(0, c.remaining / c.data.durationMs);
          const fill = c.el.querySelector(".ntf__fill");
          if (fill) fill.style.width = frac * 100 + "%";
          if (c.remaining <= 0) removeCard(c.id);
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      N.onAdd(addCard);
      N.onDismiss(removeCard); // main: this event is over
    </script>
  </body>
</html>
